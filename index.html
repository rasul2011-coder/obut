<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYRON — Премиальный магазин спортивных товаров</title>
  <meta name="description" content="VYRON — спортивные товары премиум-класса: обувь, одежда, аксессуары и спортинвентарь. Качество, стиль, технологии.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <!-- Hero Slider -->
  <section class="hero-slider" id="hero-slider"></section>

  <!-- Features -->
  <div class="container">
    <div class="features">
      <div class="feature">
        <div class="feature__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
        <div><h4>Бесплатная доставка</h4><p>При заказе от 5 000 ₽</p></div>
      </div>
      <div class="feature">
        <div class="feature__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></div>
        <div><h4>Возврат 30 дней</h4><p>Бесплатный обмен и возврат</p></div>
      </div>
      <div class="feature">
        <div class="feature__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div><h4>Безопасная оплата</h4><p>Картой, СБП или наличными</p></div>
      </div>
      <div class="feature">
        <div class="feature__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div><h4>Поддержка 24/7</h4><p>Ответим в течение 15 минут</p></div>
      </div>
    </div>
  </div>

  <!-- Categories -->
  <section class="section section--gray">
    <div class="container">
      <h2 class="section-title">Категории</h2>
      <div class="category-grid" id="category-grid"></div>
    </div>
  </section>

  <!-- Hit Products -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">Хиты продаж</h2>
      <div class="product-grid" id="hit-products"></div>
    </div>
  </section>

  <!-- Promo Banner -->
  <section class="section">
    <div class="container">
      <div class="promo-banner" id="promo-banner"></div>
    </div>
  </section>

  <!-- New Arrivals -->
  <section class="section section--gray">
    <div class="container">
      <h2 class="section-title">Новинки</h2>
      <div class="product-grid" id="new-products"></div>
    </div>
  </section>

  <!-- Promo Codes -->
  <section class="section section--dark">
    <div class="container">
      <h2 class="section-title" style="color:#fff">Промокоды</h2>
      <div class="promo-codes" id="promo-codes"></div>
    </div>
  </section>

  <!-- Sale -->
  <section class="section">
    <div class="container">
      <h2 class="section-title">Распродажа</h2>
      <div class="product-grid" id="sale-products"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
